name: Verify

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node 24 verification
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run repository verification
        run: npm run verify

      - name: Package pinned Workspace Skills
        run: npm run skills:package -- --source-ref "$GITHUB_SHA"

      - name: Upload Workspace Skill release
        uses: actions/upload-artifact@v6
        with:
          name: workspace-skills-${{ github.sha }}
          path: dist/workspace-skills/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
